name: Bootstrap Ranking D1

on:
  push:
    branches: [feat/online-ranking-v1]
    paths:
      - .github/workflows/bootstrap-ranking-d1.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure ranking databases exist
        shell: bash
        run: |
          set -euo pipefail

          database_id() {
            local name="$1"
            npx wrangler d1 list --json | node -e '
              let raw="";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const name = process.argv[1];
                const rows = JSON.parse(raw);
                const match = rows.find(row => row.name === name);
                process.stdout.write(match?.uuid ?? match?.id ?? "");
              });
            ' "$name"
          }

          ensure_database() {
            local name="$1"
            local id
            id="$(database_id "$name")"
            if [ -z "$id" ]; then
              npx wrangler d1 create "$name" --location apac
              id="$(database_id "$name")"
            fi
            if [ -z "$id" ]; then
              echo "Could not resolve D1 database id for $name" >&2
              exit 1
            fi
            printf '%s' "$id"
          }

          PROD_ID="$(ensure_database multicolor-sweeper-ranking)"
          PREVIEW_ID="$(ensure_database multicolor-sweeper-ranking-preview)"

          echo "PROD_D1_ID=$PROD_ID"
          echo "PREVIEW_D1_ID=$PREVIEW_ID"
          {
            echo "### Ranking D1"
            echo
            echo "PROD_D1_ID=$PROD_ID"
            echo "PREVIEW_D1_ID=$PREVIEW_ID"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
