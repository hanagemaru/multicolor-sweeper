name: Read Sweeper usage (one-off, no writes)

on:
  push:
    branches: [ops/readonly-sweeper-usage-20261114]
    paths:
      - scripts/report-live-usage-readonly.mjs
      - .github/workflows/read-usage-once.yml

jobs:
  usage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without mutation
        run: npm ci --no-audit
      - name: Query production D1 with aggregate-only SELECTs
        run: node scripts/report-live-usage-readonly.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
