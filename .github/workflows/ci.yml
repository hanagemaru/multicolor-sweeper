name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload QA build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr19-qa-dist
          path: dist
          retention-days: 1
