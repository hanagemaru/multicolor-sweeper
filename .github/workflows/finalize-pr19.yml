name: Finalize PR19

on:
  push:
    branches: [ui/board-first-ranking-pause]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/board-first-ranking-pause
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved UI and docs
        run: python scripts/finalize-pr19.py
      - name: Commit finalized PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Board First UI and terminology"
          git push origin HEAD:ui/board-first-ranking-pause
