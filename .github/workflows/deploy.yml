name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # リポジトリ変数 CLOUDFLARE_DEPLOY を true にするまでスキップされる。
    # 設定手順は DEPLOY.md を参照。
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
        env:
          # Cloudflare Web Analytics のサイトトークン。未設定ならビーコンは出力されない。
          VITE_GAMEPLAY_ANALYTICS_MODE: "production"
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Verify published gameplay analytics disclosure
        run: |
          node --input-type=module <<'NODE'
          for (const [path, text] of [
            ['/privacy/', 'PuttとMulticolor Sweeperでは、'],
            ['/en/privacy/', 'Putt and Multicolor Sweeper record a temporary visit ID'],
          ]) {
            const response = await fetch(`https://hanage.app${path}`, { cache: 'no-store' });
            if (!response.ok || !(await response.text()).includes(text)) throw new Error(`Disclosure not published: ${path}`);
          }
          console.log('Japanese and English Sweeper analytics disclosure verified.');
          NODE
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply multicolor-sweeper-ranking --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy | tee wrangler-deploy-output.txt
          grep -F 'env.DB (multicolor-sweeper-ranking)' wrangler-deploy-output.txt >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production ranking API
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://multicolor-sweeper.jibunnha.workers.dev/api/health');
          const body = await response.json();
          if (!response.ok || !body?.ok) throw new Error(`Production health failed: ${response.status}`);
          console.log('Production ranking API health passed');
          NODE

      - name: Verify production gameplay event persistence
        run: node scripts/verify-gameplay-live.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
