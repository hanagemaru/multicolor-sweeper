name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # リポジトリ変数 CLOUDFLARE_DEPLOY を true にするまでスキップされる。
    # 設定手順は DEPLOY.md を参照。
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply multicolor-sweeper-ranking --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy | tee wrangler-deploy-output.txt
          grep -F 'env.DB (multicolor-sweeper-ranking)' wrangler-deploy-output.txt >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production ranking API
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://multicolor-sweeper.jibunnha.workers.dev/api/health');
          const body = await response.json();
          if (!response.ok || !body?.ok) throw new Error(`Production health failed: ${response.status}`);
          console.log('Production ranking API health passed');
          NODE
