name: Finalize UI polish

on:
  push:
    branches: [fix/ui-polish-gesture-pause]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-polish-gesture-pause
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved UI polish
        run: python scripts/finalize-ui-polish.py
      - name: Commit finalized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish language toggle, gestures, and pause UI"
          git push origin HEAD:fix/ui-polish-gesture-pause
